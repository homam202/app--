name: Build GeoPulse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Android Folder & Preserve Dart Code
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup
          flutter create --platforms=android --org com.geopulse.tefsm --project-name geopulse .
          cp -r /tmp/lib_backup/* lib/
          cp /tmp/pubspec_backup pubspec.yaml

      - name: Inject Bluetooth Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <application/' "$MANIFEST"

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch flutter_bluetooth_serial Namespace for Gradle 8
        run: |
          PLUGIN_GRADLE=$(find ~/.pub-cache -name "build.gradle" | grep "flutter_bluetooth_serial" | head -n 1)
          if [ -n "$PLUGIN_GRADLE" ]; then
            sed -i 's/android {/android {\n    namespace "io.github.edufolly.flutterbluetoothserial"/' "$PLUGIN_GRADLE"
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload GeoPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoPulse-APK
          path: build/app/outputs/flutter-apk/app-release.apk
